[DEFAULT]
# Unique instance number on the Victron D-Bus (1-255)
DeviceInstance = 0

# Friendly name shown in VictronConnect / Venus OS
CustomName = go-e Wallbox

# Logging verbosity: DEBUG, INFO, WARNING, ERROR, CRITICAL
LogLevel = INFO

[ONPREMISE]
# IP address (or hostname) of your go-eCharger wallbox
Host = 192.168.1.XX
